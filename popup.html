<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Color Highlighter Settings</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 320px;
        background: #f8f9fa;
        padding: 12px;
      }

      .popup-container {
        background: white;
        border-radius: 8px;
      }

      h2 {
        margin-bottom: 14px;
        font-size: 16px;
        color: #333;
      }

      .setting-group {
        margin-bottom: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid #e0e0e0;
      }

      .setting-group:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
      }

      .settings-list {
        display: block;
      }

      label {
        display: block;
        margin-bottom: 6px;
        color: #555;
        font-size: 13px;
        font-weight: 500;
      }

      select {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: white;
        cursor: pointer;
        font-size: 13px;
      }

      select:focus {
        outline: none;
        border-color: #0066cc;
        box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
      }

      textarea {
        width: 100%;
        min-height: 84px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: white;
        font-size: 12px;
        resize: vertical;
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
      }

      textarea:focus {
        outline: none;
        border-color: #0066cc;
        box-shadow: 0 0 0 2px rgba(0, 102, 204, 0.1);
      }

      .hint {
        margin-top: 6px;
        color: #777;
        font-size: 11px;
        line-height: 1.3;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        font-size: 13px;
      }

      input[type="checkbox"] {
        cursor: pointer;
        width: 16px;
        height: 16px;
        accent-color: #0066cc;
      }

      .status-message {
        margin-top: 12px;
        padding: 8px;
        border-radius: 4px;
        font-size: 12px;
        display: none;
      }

      .status-message.show {
        display: block;
      }

      .status-message.success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status-message.error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
    </style>
  </head>
  <body>
    <div class="popup-container">
      <h2>Highlighter Settings</h2>

      <div class="settings-list">
        <div class="setting-group">
          <label class="checkbox-label">
            <input type="checkbox" id="enabled" />
            On/Off
          </label>
        </div>

        <div class="setting-group">
          <label for="mode">Highlight/Hover:</label>
          <select id="mode">
            <option value="highlight">Highlight</option>
            <option value="hover">Hover</option>
          </select>
        </div>

        <div class="setting-group">
          <label for="includeRegexes">Include regexes (one per line):</label>
          <textarea
            id="includeRegexes"
            placeholder="Example:\n^#\n^rgb\n-gradient\("
          ></textarea>
          <div class="hint">
            Leave empty to include all parsable colors. Supports both
            <code>pattern</code> and <code>/pattern/flags</code> formats.
          </div>
        </div>

        <div class="setting-group">
          <label for="excludeRegexes">Exclude regexes (one per line):</label>
          <textarea
            id="excludeRegexes"
            placeholder="Example:\ntransparent\ncurrentColor"
          ></textarea>
          <div class="hint">
            Matching values are hidden even if they match include regexes.
          </div>
        </div>
      </div>

      <div id="statusMessage" class="status-message"></div>
    </div>

    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
